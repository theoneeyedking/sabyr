[project]
name = "sabyr-ml"
version = "0.1.0"
description = "Sabyr: синтетические данные, признаки, граф получателей и скоринг риска"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "lightgbm", "networkx", "scipy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sabyr_ml"]
