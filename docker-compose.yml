# Sabyr.
#   make demo                      — всё для демо одной командой: реестр Fabric, БД, backend, шлюз, данные
#   docker compose up -d --build   — только БД и backend (без реестра: ledger.status = unavailable)
# Профили: `ledger` — шлюз и обозреватель реестра (сеть Fabric поднимает ledger/network/up.sh),
#          `own-llm` — сервер своей дообученной модели ассистента.
name: sabyr

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sabyr}
      POSTGRES_USER: ${POSTGRES_USER:-sabyr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sabyr} -d ${POSTGRES_DB:-sabyr}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # БД доступна только с этой машины

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  ledger-gateway:
    profiles: ["ledger"]
    build: ./ledger/gateway
    environment:
      CRYPTO_PATH: /crypto
      CHANNEL: sabyr
      CHAINCODE: sabyr
      LEDGER_GATEWAY_TOKEN: ${LEDGER_GATEWAY_TOKEN:?задайте LEDGER_GATEWAY_TOKEN в .env}
    volumes:
      - ./ledger/network/fabric-samples/test-network/organizations:/crypto:ro
    networks: [default, fabric]
    ports:
      - "${LEDGER_PORT:-8090}:8090"   # http://localhost:8090 — «Обозреватель реестра»
    restart: unless-stopped

  llm:
    profiles: ["own-llm"]
    build: ./ml/llm
    environment:
      SABYR_ADAPTER_DIR: /models/sabyr-assistant
    volumes:
      - ./ml/llm/out:/models:ro
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8001:8001"

networks:
  fabric:
    name: fabric_test
    external: true

volumes:
  pgdata:
  hf-cache:
